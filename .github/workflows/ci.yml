name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nouveau push annule l'exécution en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Cache des environnements pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # --only-dev : outils de lint seulement, sans installer pyspark
      - run: uv run --locked --only-dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (pytest + Spark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10
      # Les jars Delta sont téléchargés par Ivy au premier démarrage de Spark :
      # on les met en cache, la clé change quand les dépendances changent
      - name: Cache des jars Delta (Ivy)
        uses: actions/cache@v6
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked
      - run: uv run pytest
