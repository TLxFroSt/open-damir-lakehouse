# Configuration du lakehouse Open DAMIR.
# Toute clé peut être surchargée par une variable d'environnement
# DAMIR_<SECTION>_<CLE>, par exemple DAMIR_PATHS_RAW_DIR=D:/damir/raw.
# Les chemins relatifs partent du dossier de ce fichier.

paths:
  raw_dir: data/raw # fichiers mensuels téléchargés (A202501.csv.gz, ...)
  bronze_dir: data/bronze # tables Delta brutes, partitionnées par _year_month
  silver_dir: data/silver # tables Delta typées et quarantaine
  nomenclatures_file: reference/nomenclatures.csv # libellés des codes, versionné

source:
  # Nom des fichiers mensuels : « A » + année + mois sur 2 chiffres
  file_name_template: "A{year}{month:02d}.csv.gz"
  csv_separator: ";"
  csv_encoding: UTF-8

spark:
  master: local[*]
  app_name: open-damir-lakehouse
  # Mémoire du driver en mode local (défaut Spark : 1g, trop juste pour ~6 Go par mois)
  driver_memory: 6g

bronze:
  table_name: open_damir
  # Un .gz n'est pas découpable : Spark le lit sur un seul cœur. Les lignes sont
  # ensuite réparties en N fichiers pour écrire le Parquet en parallèle (≈ nb de cœurs).
  files_per_month: 12

silver:
  table_name: open_damir
  # Lignes rejetées (jamais supprimées), avec leurs motifs de rejet
  quarantine_table_name: open_damir_quarantine
  # Libellés des codes DAMIR, rechargés depuis nomenclatures_file à chaque exécution
  nomenclatures_table_name: nomenclatures
