damir:
  target: local
  outputs:
    # Local : DuckDB lit les tables Delta du silver et stocke la couche gold dans un fichier
    local:
      type: duckdb
      # Chemin relatif au répertoire courant ; « python -m damir.gold » passe un chemin absolu
      path: "{{ env_var('DAMIR_GOLD_DB', '../data/gold/damir.duckdb') }}"
      extensions:
        - delta
      threads: 4

    # Databricks depuis un poste (dbt build --target databricks, adaptateur dbt-databricks).
    # Dans le job Databricks, la tâche dbt génère son propre profil depuis l'entrepôt SQL.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DAMIR_CATALOG', 'workspace') }}"
      schema: gold
      threads: 4
