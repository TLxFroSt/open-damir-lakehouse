# Contrôles lancés avant chaque commit (et en CI via `pre-commit run --all-files`).
# Installation locale : uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Garde-fou : bloque l'ajout accidentel d'un fichier de données volumineux
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Même version que ruff dans pyproject.toml : garder les deux alignées
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Vérifie que uv.lock reste synchronisé avec pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      - id: uv-lock
