# Journalisation Spark (log4j2), chargée par build_spark_session().
# Niveau WARN par défaut ; quelques messages connus et sans conséquence sont masqués.

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1} : %m%n%ex

# Windows : à l'arrêt, Spark ne peut pas supprimer ses jars encore verrouillés par la JVM
# (dossiers spark-* laissés dans %TEMP%). Erreur sans effet sur les données écrites.
logger.shutdown.name = org.apache.spark.util.ShutdownHookManager
logger.shutdown.level = off
logger.sparkenv.name = org.apache.spark.SparkEnv
logger.sparkenv.level = error

# Bibliothèque zlib native absente : Hadoop bascule sur l'implémentation Java
logger.zlib.name = org.apache.hadoop.io.compress.zlib.ZlibFactory
logger.zlib.level = error

# Plan d'exécution tronqué dans les logs (56 colonnes DAMIR) : purement cosmétique
logger.plan.name = org.apache.spark.util.SparkStringUtils
logger.plan.level = error
